name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m reputation_monitor check --plan examples/watch-plan.json --record examples/partial-run.json

  browser-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: chromium
          - os: macos-latest
            channel: auto
          - os: windows-latest
            channel: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the complete standalone skill
        run: python scripts/install_skill.py --dest .ci-skill --state-dir .ci-state --browser-channel ${{ matrix.channel }}
      - name: Read rendered pages and reuse a fixture session
        env:
          BRM_BROWSER_INTEGRATION: "1"
        run: >-
          python -c "import os, subprocess; from pathlib import Path; r=Path('.ci-skill/.runtime').resolve(); os.environ['BRM_BROWSER_CACHE']=str(r/'browsers'); import json; os.environ['BRM_BROWSER_CHANNEL']=json.loads((r/'browser-config.json').read_text())['browser_channel']; p=r/'venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); subprocess.run([str(p), '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_browser.py', '-v'], check=True)"
